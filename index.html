<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rock paper scissor game</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>Rock paper scissor</h1>
    <div class="Choices">
        <div class="choice" id="rock">
            <img src="stone 1.png" alt="Rock">
        </div>
        <div class="choice" id="paper">
            <img src="paper 1.png" alt="paper">
        </div>
        <div class="choice" id="scissor">
            <img src="scissor 1.png" alt="scissor">
        </div>
    </div>



    <div class="score-board">
        <div class="score">
            <p id="user-score">0</p>
            <p>YOU</p>
        </div>

        <div class="score">
            <p id="comp-score">0</p>
            <p>Computer</p>
        </div>
    </div>



    <div class="msg-container">
        <p id="messege">Play your move</p>
    </div>


    <script src="script.js"></script>

</body>
</html>
